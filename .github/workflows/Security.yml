name: Security
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - '*release*'
      - '*production*'
      - '*prod*'
  push:
    branches:
      - main
      - '*release*'
      - '*production*'
      - '*prod*'
  release:
    types: [published, created, edited, deleted, prereleased, released, unpublished]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: FassetIO/security-ci@aaa60702fb4cb298115ed4e5d52aae4233eb26e5 #v1.0.1
        with:
          defectdojo-api-key: ${{secrets.DEFECTDOJOAPIKEY}}
